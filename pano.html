<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tek Bakış — Apple Launch Radar</title>
<meta name="description" content="Tüm Apple ürün hatları tek ekranda: en son çıkan modeller ve sıradaki beklenen lansmanlar.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  /* ---- Tek Bakış sayfası stilleri ---- */
  .pano-wrap { max-width: 1240px; margin: 0 auto; padding: 28px 22px 80px; }

  .top { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
  .top h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .top .today { color: var(--text-dim); font-size: 15px; }
  .top .back {
    margin-left: auto; color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 7px 16px;
  }
  .top .back:hover { color: var(--text); background: var(--surface-2); }

  .status { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 8px; }
  .status .pill {
    font-size: 13px; font-weight: 600; border-radius: var(--radius-pill);
    padding: 7px 14px; background: var(--surface); border: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }
  .pill b { color: var(--text); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pill .dim { color: var(--text-dim); font-weight: 500; }

  .cat { margin-bottom: 34px; }
  .cat-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .cat-head h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .cat-head .n { font-size: 13px; color: var(--text-faint); }
  .cat-head .rule { flex: 1; border-top: 1px solid var(--border); position: relative; top: -4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 12px; }

  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px 12px; border-top: 3px solid var(--acc, #888);
  }
  .tile__head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .tile__icon { width: 20px; height: 20px; color: var(--acc); }
  .tile__icon svg { width: 100%; height: 100%; }
  .tile__name { font-size: 15px; font-weight: 700; }
  .tile__gen { margin-left: auto; font-size: 11px; color: var(--text-faint); font-family: var(--mono, monospace); }

  .blk { padding: 7px 0; }
  .blk + .blk { border-top: 1px solid var(--border-soft); }
  .blk__k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 3px; }
  .blk__model { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .blk__meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .blk__meta b { color: var(--text); font-weight: 600; }
  .blk--next .blk__model { color: var(--band); }
  .blk--next .blk__meta { color: var(--band); }
  .blk--next .blk__meta b { color: var(--band); }

  .cbar { position: relative; height: 4px; background: var(--surface-2); border-radius: 4px; margin: 10px 2px 4px; }
  .cbar::before, .cbar::after {
    content: ""; position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--text-faint);
  }
  .cbar::before { left: 0; }
  .cbar::after { left: 100%; background: var(--band); }
  .cbar__fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); opacity: 0.45; border-radius: 4px; }
  .cbar__now {
    position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text);
    transform: translateX(-50%); border-radius: 2px;
  }
  .cbar-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 4px; }

  .up { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .up-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; }
  .up-date { font-size: 17px; font-weight: 700; }
  .up-away { font-size: 12px; color: var(--text-dim); margin: 2px 0 9px; }
  .up-item { display: flex; align-items: baseline; gap: 7px; font-size: 13px; padding: 2.5px 0; }
  .up-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; position: relative; top: -1px; }
  .up-item .approx { color: var(--text-faint); font-size: 11px; margin-left: auto; }
</style>
</head>
<body class="pano-body">

<div class="pano-wrap">

  <div class="top">
    <h1>Tek Bakış</h1>
    <span class="today" id="pano-today"></span>
    <a class="back" href="./">&larr; Launch Radar'a dön</a>
  </div>
  <div class="status" id="pano-status"></div>

  <div id="pano-cats"></div>

  <div class="cat">
    <div class="cat-head"><h2>Önümüzdeki haftalar</h2><div class="rule"></div></div>
    <div class="up" id="pano-upcoming"></div>
  </div>

</div>

<script type="module">
  import { buildContext, predictAll, DEFAULTS, toISO, diffDays, toDate } from './assets/js/engine.js';
  import { expectedName, fmtLong } from './assets/js/ui.js';

  const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const fmtK = (iso) => { const [y,m,d] = iso.split('-').map(Number); return `${d} ${AYK[m-1]} ${String(y).slice(2)}`; };

  const BAND = { high: '#30d158', mid: '#ffd60a', low: '#ff453a', overdue: '#ff3b30' };
  const BAND_TR = { high: 'yüksek güven', mid: 'orta güven', low: 'düşük güven' };
  const ACC = { iphone: '#2997ff', ipad: '#bf5af2', mac: '#f56300', watch: '#30d158' };
  const CAT_TR = { iphone: 'iPhone', ipad: 'iPad', watch: 'Watch', mac: 'Mac' };

  const ICONS = {
    iphone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M10.6 4.9h2.8" stroke-linecap="round"/></svg>',
    ipad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4.5" y="2.5" width="15" height="19" rx="2.2"/><path d="M10.8 19.2h2.4" stroke-linecap="round"/></svg>',
    watch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="6.5" width="10" height="11" rx="3"/><path d="M9.3 6.5 9.8 3h4.4l.5 3.5M9.3 17.5l.5 3.5h4.4l.5-3.5" stroke-linejoin="round"/><path d="M17 10.5v3" stroke-linecap="round"/></svg>',
    mac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4.5" width="16" height="11" rx="1.6"/><path d="M2 18.5h20" stroke-linecap="round"/></svg>',
    imac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3.5" width="18" height="13" rx="1.8"/><path d="M9.6 16.5v3.5h4.8v-3.5M8 20h8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    macmini: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="8" width="18" height="8" rx="2"/><circle cx="7" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg>',
  };
  const iconFor = (t) => {
    if (t.id === 'imac') return ICONS.imac;
    if (t.id === 'mac-mini' || t.id === 'mac-studio') return ICONS.macmini;
    return ICONS[t.category === 'mac' ? 'mac' : t.category];
  };

  /* Hap içinde kısa ad: parantez içi ve boyut bilgisi ayıklanır */
  const kisaAd = (n) => n
    .replace(/\(([^)]*)\)/, (_, inner) => `(${inner.split(/[,/]/)[0].trim()})`)
    .replace(/\s*\d+(?:[/,]\d+)*\s*["″]/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();

  const uzak = (d) => {
    const a = Math.abs(d);
    if (a < 60) return `${a} gün`;
    if (a < 365) return `${Math.round(a / 30.44)} ay`;
    const y = Math.floor(a / 365.25), m = Math.round((a % 365.25) / 30.44);
    return m ? `${y} yıl ${m} ay` : `${y} yıl`;
  };

  /* Kullanıcı belirlenmiş sıra: iPhone büyükten küçüğe, iPad'de mini son, Mac düşükten yükseğe */
  const ORDER = new Map([
    ['iphone-duo', 10], ['iphone-promax', 11], ['iphone-pro', 12], ['iphone-air', 13],
    ['iphone-base', 14], ['iphone-e', 15], ['iphone-plus', 40], ['iphone-mini', 41],
    ['ipad-base', 20], ['ipad-air', 21], ['ipad-pro', 22], ['ipad-mini', 23],
    ['watch-se', 30], ['watch-series', 31], ['watch-ultra', 32],
    ['macbook-neo', 50], ['macbook-air', 51], ['macbook-pro-base', 52],
    ['macbook-pro-promax', 53], ['mac-mini', 54], ['imac', 55], ['mac-studio', 56],
    ['macbook-pro-13', 60], ['mac-pro', 61],
  ]);
  const CAT_ORDER = { iphone: 1, ipad: 2, watch: 3, mac: 4 };

  const load = async (f) => {
    const res = await fetch(`data/${f}`, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`data/${f} yüklenemedi (${res.status})`);
    return res.json();
  };

  try {
    const [devices, chips, families] = await Promise.all([
      load('devices.json'), load('chips.json'), load('families.json'),
    ]);
    const data = { devices: devices.devices, chips: chips.chips, families: families.families };

    const asOf = new Date();
    const ctx = buildContext(data, DEFAULTS);
    const preds = predictAll(ctx, { asOf });

    const famById = new Map(data.families.map((f) => [f.id, f]));
    const devByFam = new Map();
    for (const d of data.devices) {
      if (!devByFam.has(d.family)) devByFam.set(d.family, []);
      devByFam.get(d.family).push(d);
    }

    const tiles = preds.map((p) => {
      const fam = famById.get(p.familyId);
      const devs = devByFam.get(p.familyId) || [];
      return {
        id: p.familyId,
        label: fam.label,
        category: fam.category,
        last: {
          name: p.lastRelease.name,
          released: p.lastRelease.released,
          chip: p.lastRelease.chip,
          daysSince: p.daysSinceLast,
        },
        next: {
          name: expectedName(fam, devs, p),
          iso: p.iso,
          confidence: p.confidence,
          band: p.band.id,
          daysAway: p.daysAway,
          overdue: p.overdue,
          chipGen: p.chip ? p.chip.genKey : null,
        },
        order: ORDER.get(p.familyId) ?? 99,
      };
    }).sort((a, b) => CAT_ORDER[a.category] - CAT_ORDER[b.category] || a.order - b.order);

    /* Önümüzdeki lansman olayları — radar.js'deki 14 günlük kümeleme mantığı */
    const future = preds.filter((p) => !p.overdue).sort((a, b) => a.date - b.date);
    const events = [];
    for (const p of future) {
      const last = events[events.length - 1];
      if (last && diffDays(p.date, last.date) <= 14) last.items.push(p);
      else events.push({ date: p.date, items: [p] });
    }
    const upcoming = events.slice(0, 6).map((e) => ({
      iso: toISO(e.date),
      lead: e.items[0].announceLead,
      items: e.items.map((p) => ({
        name: expectedName(famById.get(p.familyId), devByFam.get(p.familyId) || [], p),
        category: p.category,
        band: p.band.id,
      })),
    }));

    /* ---- render ---- */
    const todayISO = toISO(asOf);
    document.getElementById('pano-today').textContent = fmtLong(asOf);

    const siri = tiles.filter(t => !t.next.overdue).sort((a,b) => a.next.daysAway - b.next.daysAway)[0];
    const yeni = tiles.slice().sort((a,b) => a.last.daysSince - b.last.daysSince)[0];
    document.getElementById('pano-status').innerHTML =
      `<span class="pill"><span class="dot" style="background:${BAND[siri.next.band]}"></span>Sıradaki lansman: <b>${siri.next.name}</b><span class="dim">${uzak(siri.next.daysAway)} sonra</span></span>` +
      `<span class="pill"><span class="dot" style="background:${ACC[yeni.category]}"></span>En yeni çıkan: <b>${yeni.last.name}</b><span class="dim">${yeni.last.daysSince} gün önce</span></span>` +
      `<span class="pill"><span class="dim">Gecikmiş hat:</span> <b>${tiles.filter(t=>t.next.overdue).map(t=>t.label).join(', ') || 'yok'}</b></span>`;

    const catsWrap = document.getElementById('pano-cats');
    for (const cat of ['iphone','ipad','watch','mac']) {
      const catTiles = tiles.filter(t => t.category === cat);
      if (!catTiles.length) continue;
      const sec = document.createElement('div');
      sec.className = 'cat';
      sec.innerHTML = `<div class="cat-head"><h2>${CAT_TR[cat]}</h2><span class="n">${catTiles.length} hat</span><div class="rule"></div></div><div class="grid"></div>`;
      const grid = sec.querySelector('.grid');
      for (const t of catTiles) {
        const n = t.next;
        const band = n.overdue ? 'overdue' : n.band;
        const p = Math.max(4, Math.min(96, Math.round((t.last.daysSince / (t.last.daysSince + n.daysAway)) * 100)));
        const chipGen = n.chipGen ? `<span class="tile__gen">${n.chipGen}</span>` : '';
        const nextMeta = n.overdue
          ? `Pencere kapandı · <b>${uzak(n.daysAway)} gecikmiş</b>`
          : `≈ <b>${fmtK(n.iso)}</b> · ${uzak(n.daysAway)} sonra`;
        const div = document.createElement('div');
        div.className = 'tile';
        div.style.setProperty('--acc', ACC[t.category]);
        div.style.setProperty('--band', BAND[band]);
        div.innerHTML = `
          <div class="tile__head"><span class="tile__icon">${iconFor(t)}</span><span class="tile__name">${t.label}</span>${chipGen}</div>
          <div class="blk">
            <div class="blk__k">Son çıkan</div>
            <div class="blk__model">${t.last.name}</div>
            <div class="blk__meta">${t.last.chip} · ${fmtK(t.last.released)} · <b>${t.last.daysSince} gün önce</b></div>
          </div>
          <div class="blk blk--next">
            <div class="blk__k">Sıradaki beklenen</div>
            <div class="blk__model">${n.name}</div>
            <div class="blk__meta">${nextMeta} · ${BAND_TR[n.band] || ''}</div>
          </div>
          <div class="cbar"><div class="cbar__fill" style="width:${p}%"></div><div class="cbar__now" style="left:${p}%"></div></div>
          <div class="cbar-lbl"><span>${fmtK(t.last.released)}</span><span>bugün</span><span>${n.overdue ? 'geçti' : '≈ ' + fmtK(n.iso)}</span></div>`;
        grid.appendChild(div);
      }
      catsWrap.appendChild(sec);
    }

    const up = document.getElementById('pano-upcoming');
    for (const ev of upcoming) {
      const card = document.createElement('div');
      card.className = 'up-card';
      const items = ev.items.map(p =>
        `<div class="up-item"><span class="up-dot" style="background:${ACC[p.category]}"></span>${p.name}<span class="approx">${BAND_TR[p.band] || ''}</span></div>`
      ).join('');
      const away = Math.round((new Date(ev.iso + 'T00:00:00Z') - new Date(todayISO + 'T00:00:00Z')) / 86400000);
      card.innerHTML = `<div class="up-date">≈ ${fmtK(ev.iso)}</div><div class="up-away">${uzak(away)} sonra · tanıtım ≈ ${ev.lead} gün önce</div>${items}`;
      up.appendChild(card);
    }
  } catch (err) {
    document.getElementById('pano-cats').append(
      Object.assign(document.createElement('p'), { textContent: `Veri yüklenemedi: ${err.message}` })
    );
  }
</script>
</body>
</html>
