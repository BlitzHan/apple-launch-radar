<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Launch Radar — Lansman Zaman Çizelgesi ve Tahmin</title>
<meta name="description" content="2020'den bugüne Apple iPhone, iPad, Mac ve Watch lansmanları; geçmiş kadanstan hesaplanan çıkış tahminleri ve çip yayılım analizi.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/timeline.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__top">
    <div class="brand">
      <h1>Apple Launch Radar</h1>
      <span>lansman kadansı &amp; çip yayılım tahmini</span>
    </div>
    <div class="masthead__spacer"></div>
    <span class="today" id="today"></span>
    <button class="icon-btn" id="theme-toggle" title="Temayı değiştir" aria-label="Temayı değiştir">◐</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="radar"     aria-selected="true">Radar</button>
    <button class="tab" role="tab" data-view="timeline"  aria-selected="false">Zaman Çizelgesi</button>
    <button class="tab" role="tab" data-view="diffusion" aria-selected="false">Çip Yayılımı</button>
    <button class="tab" role="tab" data-view="accuracy"  aria-selected="false">Model Doğruluğu</button>
    <button class="tab" role="tab" data-view="method"    aria-selected="false">Metodoloji</button>
  </nav>
</header>

<main class="app" id="app">
  <div id="filters" class="filters" hidden></div>
  <section class="view" id="view-radar"     role="tabpanel"></section>
  <section class="view" id="view-timeline"  role="tabpanel" hidden></section>
  <section class="view" id="view-diffusion" role="tabpanel" hidden></section>
  <section class="view" id="view-accuracy"  role="tabpanel" hidden></section>
  <section class="view" id="view-method"    role="tabpanel" hidden></section>
</main>

<div class="drawer-scrim" id="drawer-scrim" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Ürün detayı"></aside>
</div>
<div class="tl-tip" id="tip" hidden></div>

<script type="module" src="assets/js/main.js"></script>
<noscript>
  <p style="padding:40px;text-align:center">Bu site tahminleri tarayıcıda hesaplar; JavaScript gerekiyor.</p>
</noscript>
</body>
</html>
